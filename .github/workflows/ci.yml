name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install claude CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.232
      - name: Every skill has loadable frontmatter
        run: |
          fail=0
          for d in skills/*/; do
            name=$(basename "$d")
            f="$d/SKILL.md"
            if [ ! -f "$f" ]; then
              echo "::error::$name: no SKILL.md"; fail=1; continue
            fi
            if [ "$(head -1 "$f")" != "---" ]; then
              echo "::error::$name: SKILL.md has no YAML frontmatter - the skill will not register"; fail=1; continue
            fi
            grep -qE '^name: ' "$f"        || { echo "::error::$name: frontmatter missing 'name:'"; fail=1; }
            grep -qE '^description: ' "$f" || { echo "::error::$name: frontmatter missing 'description:'"; fail=1; }
            echo "ok: $name"
          done
          exit $fail
      - name: Validate manifests (strict)
        run: |
          claude plugin validate . --strict
          for d in skills/*/; do
            [ -d "$d/.claude-plugin" ] || continue
            echo "validating $d"
            claude plugin validate "${d%/}" --strict
          done
      - name: Manifest version agreement
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            for (const entry of m.plugins) {
              const p = JSON.parse(fs.readFileSync("skills/" + entry.name + "/.claude-plugin/plugin.json", "utf8"));
              if (entry.version && entry.version !== p.version)
                throw new Error(entry.name + ": plugin " + p.version + " vs marketplace " + entry.version);
              console.log("versions agree:", entry.name, p.version);
            }
          '

  # Manual only: evals spend API credits. Requires the ANTHROPIC_API_KEY
  # repo secret. Run before any release bump.
  evals:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install claude CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.232
      - name: Run plugin evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude plugin eval skills/adversarial-security-review --max-cost-usd 5
